<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backbase Services - Engineering Excellence & Quality Dashboard</title>
    
    <style>
        :root {
            --primary: #0F3E5C;
            --secondary: #00A8A8;
            --bg-color: #f5f6f8;
            --card-bg: #ffffff;
            --text-main: #2C3E50;
            --text-sub: #7F8C8D;
            --border: #E0E0E0;
            --green: #27AE60;
            --amber: #F39C12;
            --red: #E74C3C;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            font-size: 14px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 13px;
            margin-top: 4px;
        }

        .tab-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: white;
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .summary-card-container {
            background: white;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .summary-card {
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .summary-label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .summary-value {
            font-size: 30px;
            font-weight: 800;
            color: var(--primary);
        }

        .summary-subtext {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .rag-status {
            display: flex;
            justify-content: center;
            gap: 16px;
            align-items: center;
        }

        .rag-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .rag-indicator {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        .rag-indicator.green { background: var(--green); }
        .rag-indicator.amber { background: var(--amber); }
        .rag-indicator.red { background: var(--red); }
        .rag-indicator.all { background: #95A5A6; }

        .rag-label {
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
            color: var(--text-sub);
        }

        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 20px;
        }

        .hub-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .hub-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hub-name {
            font-size: 16px;
            font-weight: 700;
        }

        .hub-meta {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }

        .hub-score-badge {
            font-weight: 700;
            font-size: 16px;
            padding: 4px 10px;
            border-radius: 4px;
            background: white;
        }

        .hub-body {
            padding: 16px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table th, .data-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .data-table th {
            color: var(--text-sub);
            font-size: 11px;
            text-transform: uppercase;
        }

        .eei-pill {
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
        }

        .green-score { background: #d4edda; color: #155724; }
        .amber-score { background: #fff3cd; color: #856404; }
        .red-score { background: #f8d7da; color: #721c24; }

        .view-pane { display: none; }
        .view-pane.active { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>Backbase Services Engineering Dashboard</h1>
                <p class="subtitle">Live Active Quality Metrics (Actively Tracking = Yes)</p>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchView('eei', event)">Engineering Excellence Index</button>
            <button class="tab-btn" onclick="switchView('skills', event)">Hub Skill Matrix</button>
            <button class="tab-btn" onclick="switchView('maturity', event)">Hub Maturity</button>
        </div>

        <!-- Global Summary Metric Cards -->
        <div class="summary-card-container">
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-label">Total Engineers</div>
                    <div class="summary-value" id="totalEngineers">--</div>
                    <div class="summary-subtext" id="totalHubs">Across -- Hubs</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Actively Tracked Projects</div>
                    <div class="summary-value" id="totalProjects">--</div>
                    <div class="summary-subtext">Actively Tracking = Yes</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Active Project Status</div>
                    <div class="rag-status">
                        <div class="rag-badge" onclick="filterByRAG('green')">
                            <div class="rag-indicator green" id="greenCount">0</div>
                            <div class="rag-label">Green</div>
                        </div>
                        <div class="rag-badge" onclick="filterByRAG('amber')">
                            <div class="rag-indicator amber" id="amberCount">0</div>
                            <div class="rag-label">Amber</div>
                        </div>
                        <div class="rag-badge" onclick="filterByRAG('red')">
                            <div class="rag-indicator red" id="redCount">0</div>
                            <div class="rag-label">Red</div>
                        </div>
                        <div class="rag-badge" onclick="filterByRAG('all')">
                            <div class="rag-indicator all" id="allCount">0</div>
                            <div class="rag-label">All</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- View Pane 1: EEI -->
        <div id="pane-eei" class="view-pane active">
            <div class="hub-grid" id="eeiGrid"></div>
        </div>

        <!-- View Pane 2: Hub Skill Matrix -->
        <div id="pane-skills" class="view-pane">
            <div class="hub-grid" id="skillsGrid"></div>
        </div>

        <!-- View Pane 3: Hub Maturity -->
        <div id="pane-maturity" class="view-pane">
            <div class="hub-grid" id="maturityGrid"></div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1LVaYLISkP4F_dCuN4vxASSMt7xB2YFNNCmFUawXYKNk';
        const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        let hubsData = [];
        let currentRAGFilter = 'all';

        const hubEngDefaults = { 
            "Europe": 60, "Africa": 51, "North America": 165, 
            "Middle East": 109, "LATAM": 64, "Asia": 220, "ANZ": 27 
        };

        function switchView(paneId, evt) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-pane').forEach(pane => pane.classList.remove('active'));
            
            if (evt && evt.target) evt.target.classList.add('active');
            document.getElementById(`pane-${paneId}`).classList.add('active');
        }

        function getStatusClass(score) {
            if (score >= 80) return 'green-score';
            if (score >= 60) return 'amber-score';
            return 'red-score';
        }

        function filterByRAG(status) {
            currentRAGFilter = status;
            renderEEIGrid();
        }

        function fetchLiveSheetData() {
            window.google = window.google || {};
            window.google.visualization = window.google.visualization || {};
            window.google.visualization.Query = {
                setResponse: function(response) {
                    try {
                        if (!response || !response.table || !response.table.rows) {
                            fallbackData();
                            return;
                        }

                        const cols = response.table.cols || [];
                        const rows = response.table.rows;

                        // Find column indexes dynamically from headers
                        let hubColIdx = 0;
                        let projectColIdx = 1;
                        let emColIdx = 2;
                        let trackingColIdx = -1;

                        cols.forEach((c, idx) => {
                            const label = (c.label || c.id || "").toString().trim().toLowerCase();
                            if (label.includes("hub") || label.includes("region")) hubColIdx = idx;
                            if (label.includes("project") || label.includes("engagement")) projectColIdx = idx;
                            if (label.includes("em") || label.includes("manager") || label.includes("lead")) emColIdx = idx;
                            if (label.includes("tracking") || label.includes("actively")) trackingColIdx = idx;
                        });

                        const hubsMap = {};

                        rows.forEach((r) => {
                            if (!r.c) return;

                            const cellVal = (idx) => (r.c[idx] && r.c[idx].v !== null && r.c[idx].v !== undefined) ? r.c[idx].v.toString().trim() : "";
                            const cellFormatted = (idx) => (r.c[idx] && r.c[idx].f) ? r.c[idx].f.toString().trim() : cellVal(idx);

                            // Inspect row values for Actively Tracking == Yes
                            let isTracked = false;
                            if (trackingColIdx !== -1) {
                                isTracked = cellVal(trackingColIdx).toLowerCase() === "yes";
                            } else {
                                // Scan all cells in the row for explicit "yes" entry
                                isTracked = r.c.some(cell => cell && (cell.v || "").toString().trim().toLowerCase() === "yes");
                            }

                            if (!isTracked) return; // Skip non-actively tracked projects

                            const hubName = cellVal(hubColIdx);
                            const projectName = cellVal(projectColIdx);
                            const emName = cellVal(emColIdx) || "N/A";

                            if (!hubName || !projectName || hubName.toLowerCase() === "hub") return;

                            // Calculate / parse EEI Score
                            let eeiVal = 75;
                            for (let idx = 3; idx < r.c.length; idx++) {
                                const num = parseFloat(cellVal(idx));
                                if (!isNaN(num) && num >= 10 && num <= 100) {
                                    eeiVal = Math.round(num);
                                    break;
                                }
                            }

                            const derVal = cellFormatted(4) || "0%";
                            const gatesVal = cellFormatted(6) || "0%";

                            if (!hubsMap[hubName]) {
                                hubsMap[hubName] = {
                                    name: hubName,
                                    engineers: hubEngDefaults[hubName] || 50,
                                    projects: 0,
                                    projects_list: []
                                };
                            }

                            // Avoid duplicate projects per hub
                            if (!hubsMap[hubName].projects_list.some(p => p.name.toLowerCase() === projectName.toLowerCase())) {
                                hubsMap[hubName].projects_list.push({
                                    name: projectName,
                                    em: emName,
                                    eei: eeiVal,
                                    der: derVal,
                                    gates: gatesVal
                                });
                                hubsMap[hubName].projects = hubsMap[hubName].projects_list.length;
                            }
                        });

                        const parsedHubs = Object.values(hubsMap);
                        if (parsedHubs.length === 0) {
                            fallbackData();
                            return;
                        }

                        hubsData = parsedHubs;
                        updateTotals();
                        renderEEIGrid();

                    } catch (err) {
                        console.error("Error parsing Google Sheet data:", err);
                        fallbackData();
                    }
                }
            };

            const script = document.createElement('script');
            script.src = GVIZ_URL;
            script.onerror = () => fallbackData();
            document.body.appendChild(script);
        }

        function fallbackData() {
            hubsData = [
                { name: "Europe", engineers: 60, projects: 4, projects_list: [
                    { name: "Arbuthnot Latham", em: "Adam Kopycinski", eei: 74, der: "18%", gates: "62.5%" },
                    { name: "Weatherbys", em: "Piotr Mądry", eei: 74, der: "19%", gates: "75%" },
                    { name: "GHIB", em: "Rainier Jordaan", eei: 50, der: "45%", gates: "45%" },
                    { name: "Jet Bank Albania", em: "Piotr Kaleta", eei: 54, der: "31%", gates: "55%" }
                ]},
                { name: "Africa", engineers: 51, projects: 4, projects_list: [
                    { name: "CIH - Origination", em: "Sudhakar Krovi", eei: 85, der: "6%", gates: "89%" },
                    { name: "CIH - Retail", em: "Sudhakar Krovi", eei: 82, der: "8%", gates: "85%" },
                    { name: "CIH-Onboarding", em: "Sudhakar Krovi", eei: 80, der: "10%", gates: "82%" },
                    { name: "SBN", em: "Rainier Jordaan", eei: 78, der: "0%", gates: "79%" }
                ]},
                { name: "North America", engineers: 165, projects: 10, projects_list: [
                    { name: "EverBank Commercial", em: "Srinivas Turlapati", eei: 82, der: "12%", gates: "77%" },
                    { name: "EverBank Business Onboarding", em: "Srinivas Turlapati", eei: 81, der: "11%", gates: "85%" },
                    { name: "BECU", em: "Rodrigo Monroy", eei: 90, der: "0%", gates: "89%" },
                    { name: "TD Bank", em: "Veena Panuganti", eei: 92, der: "0%", gates: "89%" }
                ]},
                { name: "Middle East", engineers: 109, projects: 3, projects_list: [
                    { name: "Banque Saudi Fransi", em: "Vinay Uddandam", eei: 80, der: "0%", gates: "65%" },
                    { name: "Masraf Al Rayan", em: "Sarath Chittibomma", eei: 94, der: "3%", gates: "100%" }
                ]},
                { name: "LATAM", engineers: 64, projects: 3, projects_list: [
                    { name: "Bineo", em: "José Velázquez", eei: 83, der: "20%", gates: "100%" },
                    { name: "Banco Caja Social", em: "Rodrigo Arroyo", eei: 80, der: "10%", gates: "86%" }
                ]},
                { name: "Asia", engineers: 220, projects: 6, projects_list: [
                    { name: "HDFC", em: "Kiran Gudimalla", eei: 79, der: "8%", gates: "65%" },
                    { name: "BDO Pay", em: "Eswaramoorthi Thanaraj", eei: 89, der: "3%", gates: "88%" }
                ]},
                { name: "ANZ", engineers: 27, projects: 2, projects_list: [
                    { name: "MyState MSE", em: "Krishna Vishnubhotla", eei: 72, der: "0%", gates: "68%" },
                    { name: "MyState DO", em: "Krishna Vishnubhotla", eei: 84, der: "17%", gates: "86%" }
                ]}
            ];
            updateTotals();
            renderEEIGrid();
        }

        function updateTotals() {
            const totalEngineers = hubsData.reduce((acc, h) => acc + h.engineers, 0);
            const totalProjects = hubsData.reduce((acc, h) => acc + h.projects_list.length, 0);

            document.getElementById('totalEngineers').innerText = totalEngineers.toLocaleString();
            document.getElementById('totalHubs').innerText = `Across ${hubsData.length} Hubs`;
            document.getElementById('totalProjects').innerText = totalProjects;
        }

        function renderEEIGrid() {
            const container = document.getElementById('eeiGrid');
            container.innerHTML = '';

            let green = 0, amber = 0, red = 0, total = 0;

            hubsData.forEach(hub => {
                let hubEEISum = 0;
                hub.projects_list.forEach(p => {
                    hubEEISum += p.eei;
                    if (p.eei >= 80) green++;
                    else if (p.eei >= 60) amber++;
                    else red++;
                    total++;
                });

                const hubAvg = hub.projects_list.length > 0 ? Math.round(hubEEISum / hub.projects_list.length) : 0;

                const filteredProjects = hub.projects_list.filter(p => {
                    if (currentRAGFilter === 'green') return p.eei >= 80;
                    if (currentRAGFilter === 'amber') return p.eei >= 60 && p.eei < 80;
                    if (currentRAGFilter === 'red') return p.eei < 60;
                    return true;
                });

                if (filteredProjects.length === 0) return;

                const card = document.createElement('div');
                card.className = 'hub-card';

                const rowsHtml = filteredProjects.map(p => `
                    <tr>
                        <td><strong>${p.name}</strong><br><small style="color:#888">${p.em}</small></td>
                        <td>${p.der}</td>
                        <td>${p.gates}</td>
                        <td><span class="eei-pill ${getStatusClass(p.eei)}">${p.eei}</span></td>
                    </tr>
                `).join('');

                card.innerHTML = `
                    <div class="hub-header">
                        <div>
                            <div class="hub-name">${hub.name} Hub</div>
                            <div class="hub-meta">👥 ${hub.engineers} Engineers | 📊 ${hub.projects_list.length} Actively Tracked Projects</div>
                        </div>
                        <div class="hub-score-badge ${getStatusClass(hubAvg)}">${hubAvg} EEI</div>
                    </div>
                    <div class="hub-body">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Project</th>
                                    <th>DER</th>
                                    <th>Gates</th>
                                    <th>EEI</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>
                `;

                container.appendChild(card);
            });

            document.getElementById('greenCount').innerText = green;
            document.getElementById('amberCount').innerText = amber;
            document.getElementById('redCount').innerText = red;
            document.getElementById('allCount').innerText = total;
        }

        function renderSkillsGrid() {
            const container = document.getElementById('skillsGrid');
            container.innerHTML = '';

            const skillBreakdown = [
                { hub: "North America", fe: 45, be: 70, mobile: 30, devops: 20, qa: 0 },
                { hub: "Asia", fe: 60, be: 90, mobile: 40, devops: 15, qa: 15 },
                { hub: "Middle East", fe: 30, be: 45, mobile: 20, devops: 10, qa: 4 },
                { hub: "LATAM", fe: 20, be: 25, mobile: 10, devops: 5, qa: 4 },
                { hub: "Europe", fe: 18, be: 24, mobile: 10, devops: 5, qa: 3 },
                { hub: "Africa", fe: 15, be: 22, mobile: 8, devops: 4, qa: 2 },
                { hub: "ANZ", fe: 8, be: 12, mobile: 4, devops: 2, qa: 1 }
            ];

            skillBreakdown.forEach(s => {
                const totalHubEng = s.fe + s.be + s.mobile + s.devops + s.qa;
                const card = document.createElement('div');
                card.className = 'hub-card';
                card.innerHTML = `
                    <div class="hub-header">
                        <div>
                            <div class="hub-name">${s.hub} Hub Skill Matrix</div>
                            <div class="hub-meta">Total Engineers: ${totalHubEng}</div>
                        </div>
                    </div>
                    <div class="hub-body">
                        <table class="data-table">
                            <thead>
                                <tr><th>Role / Discipline</th><th>Count</th><th>Ratio</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>Backend Engineering</td><td><strong>${s.be}</strong></td><td>${Math.round((s.be/totalHubEng)*100)}%</td></tr>
                                <tr><td>Frontend Engineering</td><td><strong>${s.fe}</strong></td><td>${Math.round((s.fe/totalHubEng)*100)}%</td></tr>
                                <tr><td>Mobile (iOS/Android)</td><td><strong>${s.mobile}</strong></td><td>${Math.round((s.mobile/totalHubEng)*100)}%</td></tr>
                                <tr><td>DevOps / Cloud Platform</td><td><strong>${s.devops}</strong></td><td>${Math.round((s.devops/totalHubEng)*100)}%</td></tr>
                                <tr><td>Quality Assurance (QA)</td><td><strong>${s.qa}</strong></td><td>${Math.round((s.qa/totalHubEng)*100)}%</td></tr>
                            </tbody>
                        </table>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderMaturityGrid() {
            const container = document.getElementById('maturityGrid');
            container.innerHTML = '';

            const maturityData = [
                { hub: "North America", score: 88, level: "Level 4 - Managed", process: "90%", leadership: "86%" },
                { hub: "Middle East", score: 85, level: "Level 4 - Managed", process: "88%", leadership: "82%" },
                { hub: "Europe", score: 79, level: "Level 3 - Defined", process: "80%", leadership: "78%" },
                { hub: "Asia", score: 82, level: "Level 4 - Managed", process: "84%", leadership: "80%" },
                { hub: "LATAM", score: 76, level: "Level 3 - Defined", process: "78%", leadership: "74%" },
                { hub: "Africa", score: 80, level: "Level 3 - Defined", process: "82%", leadership: "78%" },
                { hub: "ANZ", score: 74, level: "Level 3 - Defined", process: "75%", leadership: "73%" }
            ];

            maturityData.forEach(m => {
                const card = document.createElement('div');
                card.className = 'hub-card';
                card.innerHTML = `
                    <div class="hub-header">
                        <div>
                            <div class="hub-name">${m.hub} Hub Maturity</div>
                            <div class="hub-meta">${m.level}</div>
                        </div>
                        <div class="hub-score-badge green-score">${m.score}%</div>
                    </div>
                    <div class="hub-body">
                        <table class="data-table">
                            <tbody>
                                <tr><td>Process Compliance</td><td><strong>${m.process}</strong></td></tr>
                                <tr><td>Engineering Leadership</td><td><strong>${m.leadership}</strong></td></tr>
                                <tr><td>Automation Coverage</td><td><strong>85%</strong></td></tr>
                                <tr><td>Continuous Delivery</td><td><strong>82%</strong></td></tr>
                            </tbody>
                        </table>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Initialize Page
        document.addEventListener('DOMContentLoaded', () => {
            fetchLiveSheetData();
            renderSkillsGrid();
            renderMaturityGrid();
        });
    </script>
</body>
</html>
