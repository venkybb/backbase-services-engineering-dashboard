            color-scheme: light;
            --red: #E74C3C;
            --amber: #F39C12;
            --green: #27AE60;
            --primary: #0F3E5C;
            --secondary: #00A8A8;
            --light: #F8F9FA;
            --border: #E0E0E0;
            --text: #2C3E50;
            --text-light: #7F8C8D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Roboto, sans-serif;
            background: #f5f6f8;
            color: var(--text);
            line-height: 1.5;
            font-size: 14px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        .rag-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .rag-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .rag-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .rag-status {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .rag-indicator {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
        }

        .rag-indicator.red { background: var(--red); }
        .rag-indicator.amber { background: var(--amber); }
        .rag-indicator.green { background: var(--green); }

        .rag-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            margin-top: 4px;
            text-align: center;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .summary-card {
            background: linear-gradient(135deg, #F5F7FA 0%, #FFFFFF 100%);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .summary-label {
            font-size: 12px;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }

        .summary-change {
            font-size: 12px;
            margin-top: 4px;
            color: var(--text-light);
        }

        .hub-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 18px;
            letter-spacing: 0.2px;
        }

        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 18px;
        }

        .hub-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
        }

        .hub-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .hub-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 14px 16px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }

        .hub-name {

            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .hub-stats {

            gap: 16px;
            font-size: 12px;
            font-weight: 500;
            opacity: 0.95;
        }

        .hub-content {
            padding: 0;
            max-height: 500px;

        }

        .project-item {

        }

        .rag-dot {

            height: 10px;
            border-radius: 50%;

            margin-top: 2px;
        }

        .rag-dot.green { background: var(--green); }
        .rag-dot.amber { background: var(--amber); }
        .rag-dot.red { background: var(--red); }

        .project-status {

            align-items: center;

        }

        .eei-score {

            background: #f0f0f0;
            min-width: 50px;

        }

        }

        .view-details {

            border-radius: 4px;

        .modal {

        .modal-close {

            border: none;

        .modal-title {

            font-weight: 600;

            text-align: right;

        .metric-weight {

            text-align: right;

        .hub-eei-summary {

            color: var(--text);
        }

        .hub-eei-score {
            font-size: 18px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 3px;
        }
    </style>
</head>

                    { name: "MyState DO", em: "Krishna Kanth Vishnubhotla", sfAccount: "N/A", security: "N/A", der: "17%", gates: "86%", api: "100%", velocity: "83%" }
                ]
            }
        ];

        let currentFilter = 'all';

        // Function to fetch and update Engineer metrics from Skill Matrix Google Sheet
        async function updateEngineerMetrics() {
            try {
                const response = await fetch(SKILL_MATRIX_CSV_URL);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const csvText = await response.text();

                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const rows = results.data;
                        if (!rows || rows.length === 0) return;

                        // Detect headers dynamically
                        const sampleRow = rows[0];
                        const keys = Object.keys(sampleRow);
                        const nameKey = keys.find(k => /name|engineer|employee|member/i.test(k));
                        const hubKey = keys.find(k => /hub|profit centre|region|location/i.test(k));

                        // Filter valid engineer entries
                        const validEngineers = rows.filter(row => {
                            if (nameKey) return row[nameKey] && row[nameKey].trim() !== '';
                            return Object.values(row).some(val => val && val.trim() !== '');
                        });

                        const totalEngineers = validEngineers.length;

                        // Calculate unique hubs
                        let uniqueHubsCount = 0;
                        if (hubKey) {
                            const uniqueHubs = new Set(
                                validEngineers
                                    .map(e => e[hubKey] ? e[hubKey].trim() : '')
                                    .filter(Boolean)
                            );
                            uniqueHubsCount = uniqueHubs.size;
                        }

                        // Update DOM Elements
                        const totalElem = document.getElementById('totalEngineers');
                        const hubsElem = document.getElementById('totalHubs');

                        if (totalElem) totalElem.innerText = totalEngineers.toLocaleString();
                        if (hubsElem) hubsElem.innerText = uniqueHubsCount > 0 ? `Across ${uniqueHubsCount} hubs` : 'Across hubs';
                    }
                });

            } catch (error) {
                console.error('Failed to load Skill Matrix metrics:', error);
            }
        }

        // EEI Calculation functions
        function scoreVelocity(valStr) {
            const val = parseFloat(valStr);
            if (isNaN(val)) return 0;
            if (val >= 85) return 100;
            if (val >= 70) return 75;
            return 50;
        }

        function scoreDER(valStr) {
            const val = parseFloat(valStr);
            if (isNaN(val)) return 0;
            if (val <= 10) return 100;
            if (val <= 20) return 75;
            return 50;
        }

        function scoreQualityGates(valStr) {
            const val = parseFloat(valStr);
            if (isNaN(val)) return 0;
            if (val >= 90) return 100;
            if (val >= 80) return 75;
            return 50;
        }

        function scoreSecurity(secVal) {
            if (secVal === "N/A" || secVal === "nan") return 50;
            let val = secVal === "Yes" ? 1.0 : parseFloat(secVal);
            if (isNaN(val)) return 50;
            if (val > 0.80) return 100;
            return 50;
        }

        function getEngineeringDirector(hubName) {
            const directors = {
                "North America": "Venkat Akkapeddi",
                "Europe": "Marek Branka",
                "Africa": "Marek Branka"
            };
            return directors[hubName] || "TBD";
        }

        function calculateEEI(project) {
            const velocityScore = scoreVelocity(project.velocity);
            const qualityScore = scoreDER(project.der);
            const gateScore = scoreQualityGates(project.gates);
            const securityScore = scoreSecurity(project.security);

            const eei = (velocityScore * 0.15) + (qualityScore * 0.30) + (gateScore * 0.30) + (securityScore * 0.25);

            return {
                total: Math.round(eei),
                velocity: velocityScore,
                quality: qualityScore,
                gates: gateScore,
                security: securityScore,
                status: getEEIStatus(eei)
            };
        }

        function getEEIStatus(score) {
            if (score >= 80) return 'green';
            if (score >= 50) return 'amber';
            return 'red';
        }

        function filterByEEIStatus(status) {
            currentFilter = status;
            renderHubs();
        }

        function renderHubs() {
            const hubGrid = document.getElementById('hubGrid');
            hubGrid.innerHTML = '';

            let greenCount = 0, amberCount = 0, redCount = 0, totalCount = 0;

            hubsData.forEach(hub => {
                const hubCard = document.createElement('div');
                hubCard.className = 'hub-card';

                let hubEEISum = 0;
                const projectsWithEEI = hub.projects_list.map(proj => ({
                    ...proj,
                    eei: calculateEEI(proj)
                }));

                projectsWithEEI.forEach(proj => hubEEISum += proj.eei.total);
                const hubAvgEEI = Math.round(hubEEISum / projectsWithEEI.length);
                const hubEEIStatus = getEEIStatus(hubAvgEEI);

                const filteredProjects = currentFilter === 'all'
                    ? projectsWithEEI
                    : projectsWithEEI.filter(proj => proj.eei.status === currentFilter);

                if (filteredProjects.length === 0) return;

                projectsWithEEI.forEach(proj => {
                    if (proj.eei.status === 'green') greenCount++;
                    else if (proj.eei.status === 'amber') amberCount++;
                    else redCount++;
                    totalCount++;
                });

                const projectsHtml = filteredProjects.map(proj => `
                    <div class="project-item">
                        <span class="project-name">
                            <span class="rag-dot ${proj.eei.status}"></span>
                            <div>
                                <div>${proj.name}</div>
                                <div>${proj.em}</div>
                            </div>
                        </span>
                        <div class="project-status">
                            <span class="eei-score ${proj.eei.status}-score">${proj.eei.total}</span>
                        </div>
                        <a href="#" class="view-details" onclick="openProjectModal(event, '${proj.name}', '${proj.em}', '${hub.name}', ${proj.eei.total}, '${proj.velocity}', '${proj.der}', '${proj.gates}', '${proj.security}', '${proj.sfAccount}')">View</a>
                    </div>
                `).join('');

                hubCard.innerHTML = `
                    <div class="hub-header">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
                            <div>
                                <div class="hub-name">
                                    <span class="rag-dot ${hubEEIStatus}"></span>${hub.name}
                                </div>
                                <div class="hub-stats">
                                    <div>👥 ${hub.engineers} Engineers</div>
                                    <div>📊 ${hub.projects} Projects</div>
                                </div>
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 8px;">
                                <a href="skillset-viewer.html?hub=${encodeURIComponent(hub.name)}" style="color: white; text-decoration: none; padding: 6px 12px; background: rgba(255,255,255,0.2); border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap;">
                                    Hub Skill Matrix
                                </a>
                                <a href="hub-maturity-dashboard.html?hub=${encodeURIComponent(hub.name)}" style="color: white; text-decoration: none; padding: 6px 12px; background: rgba(255,255,255,0.2); border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap;">
                                    Hub Maturity
                                </a>
                            </div>
                        </div>
                    </div>
                    <div style="padding: 12px 16px; background: #f9f9f9; border-bottom: 1px solid #e0e0e0;">
                        <div class="hub-eei-summary">
                            <span class="hub-eei-title">Engineering Excellence Index Score:</span>
                            <span class="hub-eei-score ${hubEEIStatus}-score">${hubAvgEEI}</span>
                        </div>
                    </div>
                    <div class="hub-content">
                        ${projectsHtml}
                    </div>
                `;

                hubGrid.appendChild(hubCard);
            });

            // Update header badge counts
            document.getElementById('greenCount').textContent = greenCount;
            document.getElementById('amberCount').textContent = amberCount;
            document.getElementById('redCount').textContent = redCount;
            document.getElementById('allCount').textContent = totalCount;
            document.getElementById('totalProjects').textContent = totalCount;
        }

        function openProjectModal(event, projectName, emName, hubName, eeiScore, velocity, der, gates, security, sfAccount) {
            event.preventDefault();
            const modal = document.getElementById('projectModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            const eeiStatus = getEEIStatus(eeiScore);
            const directorName = getEngineeringDirector(hubName);

            modalTitle.textContent = projectName;
            modalBody.innerHTML = `
                <div class="modal-section">
                    <div class="modal-section-title">Project Information</div>
                    <div class="modal-row"><span>Hub</span><strong>${hubName}</strong></div>
                    <div class="modal-row"><span>Engineering Director</span><strong>${directorName}</strong></div>
                    <div class="modal-row"><span>Engineering Manager</span><strong>${emName}</strong></div>
                    <div class="modal-row"><span>SF Account</span><strong>${sfAccount}</strong></div>
                </div>

                <div class="modal-section">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <div style="font-size: 13px; font-weight: 600; text-transform: uppercase; color: #666;">Engineering Excellence Index Score</div>
                        <strong style="color: ${eeiStatus === 'green' ? '#27AE60' : eeiStatus === 'amber' ? '#F39C12' : '#E74C3C'}; font-size: 24px;">${eeiScore}</strong>
                    </div>
                    <div style="margin-top: 10px; padding: 12px; background: #f0f0f0; border-radius: 4px;">
                        <div style="font-weight: 600; margin-bottom: 10px; font-size: 12px; text-transform: uppercase; color: #666;">Metric Breakdown</div>
                        <div class="metric-row"><span class="metric-name">Velocity (Commitment Rate)</span><span class="metric-value">${velocity}</span><span class="metric-weight" style="color: #27AE60;">15%</span></div>
                        <div class="metric-row"><span class="metric-name">Quality (Defect Escape Rate)</span><span class="metric-value">${der}</span><span class="metric-weight" style="color: #F39C12;">30%</span></div>
                        <div class="metric-row"><span class="metric-name">Quality Gates Score</span><span class="metric-value">${gates}</span><span class="metric-weight" style="color: #F39C12;">30%</span></div>
                        <div class="metric-row"><span class="metric-name">Security Score</span><span class="metric-value">${security}</span><span class="metric-weight" style="color: #E74C3C;">25%</span></div>
                    </div>
                </div>
            `;

            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('projectModal').classList.remove('show');
        }

        window.addEventListener('click', function(event) {
            const modal = document.getElementById('projectModal');
            if (event.target === modal) closeModal();
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderHubs();
            updateEngineerMetrics();
        });
    </script>
</body>
</html>
