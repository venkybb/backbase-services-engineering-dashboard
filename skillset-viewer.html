        .stats {

            gap: 24px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        .stat {
            font-size: 12px;
            color: #7F8C8D;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #0F3E5C;
        }

        .content {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(135deg, #0F3E5C 0%, #00A8A8 100%);
            color: white;
            padding: 14px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }

        tr:hover {
            background: #f9f9f9;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .name-cell {
            font-weight: 600;
            color: #0F3E5C;
        }

        .role-cell {
            color: #7F8C8D;
            font-size: 12px;
        }

        .skills-cell {
            color: #0F3E5C;
            font-size: 12px;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hub-badge {
            display: inline-block;
            background: #E8F8F8;
            color: #0F3E5C;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7F8C8D;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #7F8C8D;
        }

        let currentHub = 'North America';
        let allEngineersAllHubs = [];
        let searchActive = false;
        let isFilteredView = false;  // Track if viewing a single hub from URL parameter

        // Get hub from query parameter if present
        function getHubFromURL() {
            const params = new URLSearchParams(window.location.search);
            const hubParam = params.get('hub');
            if (hubParam && hubData[hubParam]) {
                isFilteredView = true;
                return hubParam;
            }
            return 'North America';
        }

        // Initialize with embedded data
        async function initializeData() {
            try {
                // Set initial hub from URL parameter
                currentHub = getHubFromURL();

                // Handle hub selector - hide if filtered view, else show buttons
                const hubSelectorDiv = document.getElementById('hubSelector');
                if (isFilteredView) {
                    hubSelectorDiv.style.display = 'none';
                    // Update title to reflect single-hub view
                    const titleEl = document.querySelector('.title');
                    if (titleEl) {
                        titleEl.innerHTML = currentHub + ' - Engineering Skillset Matrix';
                    }
                    // Update search placeholder
                    const searchInput = document.getElementById('searchInput');
                    if (searchInput) {
                        searchInput.placeholder = 'Search engineers in ' + currentHub + '...';
                    }
                } else {
                    // Create hub buttons for multi-hub view
                    Object.keys(hubData).forEach(hub => {
                        const btn = document.createElement('button');
                        btn.className = 'hub-btn' + (hub === currentHub ? ' active' : '');
                        btn.textContent = hub + ' (' + hubData[hub].length + ')';
                        btn.onclick = () => switchHub(hub);
                        hubSelectorDiv.appendChild(btn);
                    });
                }

                // Build complete engineer list with hub info
                buildAllEngineersWithHubs();
                
                // Update total count
                updateTotalCount();
                renderTable();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function buildAllEngineersWithHubs() {
            allEngineersAllHubs = [];
            Object.keys(hubData).forEach(hub => {
                hubData[hub].forEach(engineer => {
                    allEngineersAllHubs.push({
                        ...engineer,
                        Hub: hub
                    });
                });
            });
        }

        function switchHub(hub) {
            currentHub = hub;

            // Update active button
            document.querySelectorAll('.hub-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.startsWith(hub)) {
                    btn.classList.add('active');
                }
            });

            // Clear search when switching hubs
            document.getElementById('searchInput').value = '';
            searchActive = false;
            renderTable();
        }

        function renderTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');

            let filtered = [];

            if (searchTerm.trim() === '') {
                // No search: show current hub only
                searchActive = false;
                filtered = allEngineersAllHubs.filter(e => e.Hub === currentHub);
            } else {
                // Search active: show results from all hubs
                searchActive = true;
                filtered = allEngineersAllHubs.filter(engineer => {
                    const searchStr = `${engineer.Name} ${engineer.Role} ${engineer['Backbase Product Lines']} ${engineer.Department}`.toLowerCase();
                    return searchStr.includes(searchTerm);
                });
            }

            if (filtered.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                document.getElementById('engineerCount').textContent = '0';
                return;
            }

            emptyState.style.display = 'none';
            tbody.innerHTML = filtered.map(engineer => `
                <tr>
                    <td class="name-cell">${engineer.Name}</td>
                    <td class="role-cell">${engineer.Role}</td>
                    <td>${engineer.Department}</td>
                    <td class="skills-cell">${engineer['Backbase Product Lines']}</td>
                    <td>${engineer.Manager}</td>
                    <td><span class="hub-badge">${engineer.Hub}</span></td>
                </tr>
            `).join('');

            document.getElementById('engineerCount').textContent = filtered.length;
        }

        function updateTotalCount() {
            // Show engineer count for current hub
            const hubCount = hubData[currentHub] ? hubData[currentHub].length : 0;
            document.getElementById('engineerCount').textContent = hubCount;
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', renderTable);

        // Initialize on load
        window.addEventListener('load', initializeData);
    </script>
