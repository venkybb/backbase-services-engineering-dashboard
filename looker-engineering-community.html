            font-weight: 600;

            color: #0F3E5C;

        let currentHub = 'All';

        function initializeView() {
            const hubSelector = document.getElementById('hubSelector');
            const allBtn = document.createElement('button');
            allBtn.className = 'hub-btn active';
            allBtn.textContent = 'All Hubs (696)';
            allBtn.onclick = () => switchHub('All');
            hubSelector.appendChild(allBtn);

            Object.keys(hubsData).forEach(hub => {
                const count = hubsData[hub].length;
                const btn = document.createElement('button');
                btn.className = 'hub-btn';
                btn.textContent = `${hub} (${count})`;
                btn.onclick = () => switchHub(hub);
                hubSelector.appendChild(btn);
            });

            renderEngineers();
        }

        function switchHub(hubName) {
            currentHub = hubName;

            document.querySelectorAll('.hub-btn').forEach(btn => {
                btn.classList.remove('active');
                if (hubName === 'All' && btn.textContent.startsWith('All')) {
                    btn.classList.add('active');
                } else if (hubName !== 'All' && btn.textContent.startsWith(hubName)) {
                    btn.classList.add('active');
                }
            });

            renderEngineers();
        }

        function renderEngineers() {
            const tbody = document.getElementById('tableBody');
            let engineers = [];

            if (currentHub === 'All') {
                Object.values(hubsData).forEach(hubEngineers => {
                    engineers = engineers.concat(hubEngineers);
                });
            } else {
                engineers = hubsData[currentHub] || [];
            }

            tbody.innerHTML = engineers.map(eng => `
                <tr>
                    <td class="name-cell">${eng.name}</td>
                    <td class="role-cell">${eng.seniority}</td>
                    <td>${eng.location}</td>
                    <td>${eng.profession}</td>
                </tr>
            `).join('');

            document.getElementById('hubCount').textContent = engineers.length;
        }

        window.addEventListener('load', initializeView);
